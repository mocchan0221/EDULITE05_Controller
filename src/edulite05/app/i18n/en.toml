[control.mit]
tab = "MIT"
title = "Motion-control (MIT) mode"
desc = "run_mode 0. Outputs t = Kp·(p_set − p) + Kd·(v_set − v) + t_ff through the current loop."

[control.velocity]
tab = "Velocity"
title = "Velocity mode"
desc = "run_mode 2. Tracks a velocity command with acceleration limiting. The default current limit is at or below the Low power cap."

[control.current]
tab = "Current"
title = "Current mode"
desc = "run_mode 3. Commands Iq directly. On this EL05, 1 A of Iq command gives about 0.1 A of actual current (about 0.07 N·m at the output, measured)."

[control.csp]
tab = "CSP"
title = "Position mode (CSP)"
desc = "run_mode 5. Tracks the target position within the speed limit."

[control.pp]
tab = "PP"
title = "Position mode (PP)"
desc = "run_mode 1. Moves to the target position with a trapezoidal velocity profile (max speed, acceleration)."

[control.jog]
tab = "JOG"
title = "JOG (rotates while held)"
desc = "Rotates only while the button is held, and stops on release."

[control.test]
tab = "Test signal"
title = "Test signal"
desc = "Outputs a sine wave or step to the chosen quantity so you can check the response on the graph."

