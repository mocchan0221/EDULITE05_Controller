[tool.set_can_id]
title = "Change CAN ID"
desc = "Changes the motor's CAN ID (type 7)."
confirm = "Change the CAN ID of the motor with ID {id} to {new_id}?"
warn = "Takes effect immediately. The motor will answer on the new ID."

[tool.set_zero]
title = "Set zero"
desc = "Makes the current position the mechanical zero (type 6)."
confirm = "Set the current position of ID {id} as zero?"
warn = "Only effective in MIT and CSP modes. Run it only while the motor is stopped."

[tool.active_report]
title = "Active report"
desc = "Turns automatic feedback from the motor ON/OFF and sets its period (type 24)."
confirm = "Set active report of ID {id} to {state}?"
warn = "Period = 10 + 5·N ms (measured). Mind the bus bandwidth."

[tool.can_timeout]
title = "CAN timeout"
desc = "Time after which the motor stops when communication is lost (0x7028)."
confirm = "Set the CAN timeout of ID {id} to {seconds_text}?"
warn = "0 disables it. Enabling it is recommended so that no command lingers if the GUI crashes."

[tool.set_baud]
title = "Change CAN baud rate"
desc = "Changes the baud rate on the motor side (type 23)."
confirm = "Change the baud rate of ID {id} to {baud_text}?"
warn = "Takes effect after a power cycle. If the adapter is not set to match, communication will be lost."

[tool.switch_protocol]
title = "Switch protocol"
desc = "Switches between Private / CANopen / MIT (type 25)."
confirm = "Switch the protocol of ID {id} to {protocol_text}?"
warn = "Takes effect after a power cycle. This tool may no longer be able to talk to the motor afterwards."

[tool.restore_protocol]
title = "Restore private protocol"
desc = "Returns the motor from CANopen / MIT to the private protocol."
confirm = "Restore ID {id} to the private protocol?"
warn = "Sends the restore frame. A power cycle is required."

