# RobStride EduLite 05 (EL05) プロファイル。モータ固有の数値の正(CLAUDE.md)。
# 出典: docs/research/el05_protocol.md §1.5(レンジ)/ §5.2(パラメータ)、architecture.md §4.3.1(出力段階)
# 注意: 0x70xx のパラメータは運転用の値(runtime)で、type 22 で保存されず、電源を切ると工場値に戻る
#   (実測 HW-6)。永続化されるのは 0x20xx と 0x702A / 0x702B(§2.10)。ここの default は工場値。
# group は app/pages/params/groups.py の分類(制御ゲイン / 制限 / 指令 / 状態 / 設定)に合わせる。

[motor]
model = "EL05"
name = "RobStride EduLite 05"

[ranges]  # type 1/2 のスケーリング範囲(§1.5。EN の T=±5.5 は誤記で ±6)
position = [-12.57, 12.57]
velocity = [-50.0, 50.0]
torque = [-6.0, 6.0]
kp = [0.0, 500.0]
kd = [0.0, 5.0]

# 位置の折り返しと MIT の p_set の座標系(el05_protocol.md §8.0、hw_bench.md HW-3b、open_questions.md Q-P12)
#  - type 2 フィードバックの位置は ±wrap_half(= 4π)で折り返す。mechPos(0x7019)は折り返さない多回転値。
#  - wrap_margin [rad]: 多回転位置が wrap_half - wrap_margin を超える領域では、MIT の位置目標(p_set の
#    レンジが ±4π)を表現できない / 曖昧なので SafetyGuard が kp を 0 にする(減衰と t_ff のみ)。
#  - mit_position_frame: MIT の p_set をモータ内部で何と比べるか(実機未確認 = Q-P12)。
#      "unknown" = 両方の解釈で最悪トルクを見積もる(既定。確認できるまで変えない)
#      "wrapped" = 折り返し位置(type 2 の位置)と比べる
#      "multi"   = 多回転位置(mechPos)と比べる
#    Q-P12 を実機で確認したら、"wrapped" か "multi" に更新する。
[position]
wrap_half = 12.566370614359172  # 4π [rad]
wrap_margin = 0.5
mit_position_frame = "unknown"

[limits]  # 物理上限
current = 11.0
speed = 50.0
torque = 6.0
temp_fault = 135.0

# kd_negative_max: MIT の kd の負側の上限(大きさ)。フレームの kd は 0–5 で負を送れないため、
#   kd < 0 は PC 側で t_ff += kd·(v_set - v) として足す(SafetyGuard。architecture.md §4.3.1)。
# friction_comp_max: 摩擦補償 t_ff += friction_comp·tanh(v / v_eps) の上限 [N·m]。
[power_tiers.low]  # architecture.md §4.3.1
torque = 0.5
current = 1.0
speed = 5.0
kp = 20.0
kd = 1.0
kd_negative_max = 0.05
friction_comp_max = 0.1

[power_tiers.high]
torque = 6.0
current = 11.0
speed = 50.0
kp = 500.0
kd = 5.0
kd_negative_max = 0.2
friction_comp_max = 0.3

# MIT のホスト側項(負の kd・摩擦補償)と暴走ガード(SafetyGuard。docs/research/hw_bench.md HW-4:
# この個体のクーロン摩擦 ≈ 0.03 N·m、粘性 ≈ 0.014 N·m·s/rad)
#  - friction_v_eps [rad/s]: tanh(v / v_eps) の幅
#  - runaway_on / runaway_off: 段階の速度上限に対する比。|v| > on で暴走ガード開始、|v| < off で解除
#  - guard_kd: ガード中に強制する最低の kd(フレームの kd)
[mit_host]
friction_v_eps = 0.05
runaway_on = 0.8
runaway_off = 0.4
guard_kd = 0.1


# 消費電力の概算(core/telemetry/power.py。運転ページの「消費電力」と telemetry の `power_est`)
#   P_in = τ·ω + 1.5·R_ph·(|τ|/Kt)² + P_base。バス電流は測っていない目安値。
# 係数の較正状況:
#  - kt [N·m/A]: 0.65 = **実測**(MEASURED。トルク読み値 = 0.62–0.66 × iqf(実 q 電流)。
#    hw_bench.md HW-6 の追試)。なお電流モードの実電流は iq_ref の約 1/9(1 A 指令で約 0.1 A)
#  - 以下の r_phase / p_base は未較正(UNCALIBRATED):
#  - r_phase [Ω]: 1.36 = RS05 の線間抵抗 2.72 Ω の半分。EL05 の値は公表されていない
#  - p_base [W]: 1.0(制御回路などの待機消費の仮置き)
[power_estimate]
kt = 0.65  # 実測
r_phase = 1.36
p_base = 1.0


