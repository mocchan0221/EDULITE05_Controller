# English strings for the example_triangle plugin. Keys are the original (Japanese) UI text.
"三角波テスト信号(サンプル)" = "Triangle test signal (sample)"
"運転モード「三角波」と情報ページを追加するサンプル" = "Sample that adds a \"Triangle wave\" operate mode and an info page"
"三角波" = "Triangle"
"目標の量に三角波を出します" = "Outputs a triangle wave to the target quantity"
"対象(位置・速度・電流・トルク)に、振幅と周波数を指定した三角波を出します。" = "Outputs a triangle wave with the given amplitude and frequency to the chosen quantity (position, velocity, current or torque)."
"三角波の試験信号" = "Triangle-wave test signal"
"プラグインのサンプルです。運転ページのモード選択に「三角波」を追加します。" = "A plugin sample. It adds \"Triangle wave\" to the mode selector on the Operate page."
"使い方" = "How to use"
"運転ページを開く" = "Open Operate"
"モードを選ぶ" = "Choose the mode"
"運転ページの「その他 ▾」から「三角波」を選び、目標(対象・振幅・周波数)を入れます。" = "On the Operate page, choose \"Triangle wave\" from \"More ▾\" and enter the target (quantity, amplitude, frequency)."
"安全" = "Safety"
"指令は他のモードと同じく SafetyGuard を通り、出力段階(LOW/HIGH)の上限で制限されます。" = "Like every other mode, commands go through SafetyGuard and are capped by the power tier (Low / High power)."
"プラグイン" = "Plugin"
"{name} {version}(plugins/example_triangle)。設定ページで有効・無効を切り替えられます。" = "{name} {version} (plugins/example_triangle). You can turn it on or off in Settings."
